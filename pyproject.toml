[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hardcoding-telegram-bot-starter"
version = "1.0.0"
description = "Шаблон Telegram-бота для Hardcoding PRO"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "aiosqlite>=0.20,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
